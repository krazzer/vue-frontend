name: Build & Release Frontend

on:
    push:
        branches:
            - main
        tags:
            - 'v*'

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   name: Checkout repo
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Setup Node
                uses: actions/setup-node@v7
                with:
                    node-version: 24

            -   name: Install dependencies
                run: npm install --legacy-peer-deps

            -   name: Build Vue app
                run: npm run build

            -   name: Zip dist folder
                run: cd dist && zip -r ../cms.zip . && cd ..

            -   name: Determine release type (latest or version)
                id: vars
                run: |
                    if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                      echo "tagged_release=true" >> $GITHUB_OUTPUT
                      echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                    else
                      echo "tagged_release=false" >> $GITHUB_OUTPUT
                      echo "tag_name=latest" >> $GITHUB_OUTPUT
                    fi

            -   name: Update 'latest' git tag
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

                    # Remove the old 'latest' tag if it exists
                    git tag -d latest 2>/dev/null || true
                    git push origin :refs/tags/latest 2>/dev/null || true

                    # Create a new 'latest' tag pointing to the current commit 
                    git tag latest
                    git push origin latest --force

            -   name: Publish Release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ steps.vars.outputs.tag_name }}
                    name: ${{ steps.vars.outputs.tag_name }}
                    files: cms.zip
                    prerelease: false
                    generate_release_notes: false
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}